name: Bug Report / Content Issue
description: Report an error in the case study documentation, broken link, or incorrect information.
title: "[Bug]: "
labels: ["bug", "documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve this case study. Please provide as much detail as possible.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is wrong or unclear?
      placeholder: The Google share link returns 404 / The timeline section is missing a step...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What should it say or do instead?
    validations:
      required: false
  - type: input
    id: section
    attributes:
      label: Affected section
      placeholder: e.g. What We Delivered / FAQ / Live Links
    validations:
      required: false
