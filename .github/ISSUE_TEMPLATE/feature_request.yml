name: Feature / Improvement Request
description: Suggest an improvement to the case study, additional assets, or related documentation.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Share your idea to make this case study more useful for other local businesses or practitioners.
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to see added or improved?
      placeholder: Add a Gujarati summary / Include a sample Google Business optimization checklist...
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is this useful?
      description: Who benefits and how?
    validations:
      required: false
